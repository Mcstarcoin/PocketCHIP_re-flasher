# Zadig preset: C.H.I.P. / PocketCHIP U-Boot fastboot mode.
# The GUID is the Android USB interface class that Google's fastboot.exe
# searches for; without it fastboot.exe cannot see the device.
# In Zadig: Device > Load Preset Device > pick this file > Install Driver (WinUSB).
[device]
  Description = "CHIP fastboot mode"
  VID = 0x1F3A
  PID = 0x1010
  GUID = "{F72FE0D4-CBCB-407D-8814-9ED673D0DD6B}"
